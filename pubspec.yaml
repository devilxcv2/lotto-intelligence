name: lotto_intelligence
description: Laboratorio di analisi del Lotto italiano. Statistiche descrittive, sistemi e backtest, senza pretese predittive.
publish_to: 'none'
version: 0.5.16+24

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  # Drift 2.35 richiede drift_dev con analyzer >=10, che a sua volta vuole
  # meta ^1.18. Flutter 3.41.6 fissa meta 1.17.0, quindi il codice generato
  # usa Drift 2.31, l'ultima serie compatibile con questo SDK.
  drift: 2.31.0
  sqlite3_flutter_libs: 0.5.40
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.1
  archive: ^4.0.9
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  file_picker: ^13.1.0
  pdf: ^3.12.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.31.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVu-copyright.txt
    # Solo le voci wiki aperte dall'app (non tutta la cartella di sviluppo).
    - wiki/00_INDEX.md
    - wiki/01_VISION.md
    - wiki/06_DATA_SOURCES.md
    - wiki/10_PROBABILITY_THEORY.md
    - wiki/18_ANDROID_BUILD.md
    - wiki/23_CHANGELOG.md
    - wiki/27_KNOWN_LIMITATIONS.md
    - wiki/28_PRIZES_AND_ALERTS.md

